  <style>
* { box-sizing: border-box; }
:root { color-scheme: light; font-family: 'Courier New', monospace; color: #574487; background: #afe7f9; }
body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: 32px 20px; }
.sky { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: -1; }
.cloud { position: absolute; width: var(--size); top: var(--top); left: 0; animation: drift var(--speed) linear infinite; animation-delay: var(--delay); opacity: .95; }
.cloud svg { width: 100%; height: auto; display: block; }
.card { width: min(100%, 560px); text-align: center; padding: 20px 12px; }
.eyebrow { margin: 0 auto; max-width: 390px; font-size: .875rem; font-weight: 700; line-height: 1.7; letter-spacing: .06em; }
.heart { width: 100px; height: 100px; margin: 30px auto; animation: heartbeat 1.4s steps(2, end) infinite; }
.heart svg { width: 100%; height: 100%; display: block; }
h1 { font-family: 'Courier New', monospace; text-transform: uppercase; font-size: clamp(2rem, 7.8vw, 3.65rem); font-weight: 900; line-height: 1.2; letter-spacing: -.045em; color: #8751aa; margin: 18px 0 24px; text-shadow: -3px -3px 0 white, 3px -3px 0 white, -3px 3px 0 white, 3px 3px 0 white, 0 6px 0 #8faee2; }
.pixel-title { width: 80%; max-width: 424px; margin: 18px auto 24px; line-height: 0; }
.pixel-title svg { display: block; width: 100%; height: auto; overflow: visible; }
.subtitle { max-width: 420px; margin: auto; color: #a93958; font-size: clamp(1rem, 4vw, 1.25rem); font-weight: 700; line-height: 1.65; }
.play-area { position: relative; height: 220px; max-width: 360px; margin: 14px auto 0; }
.button { border: 3px solid #60509a; border-radius: 0; min-height: 50px; padding: 10px 16px; font: bold 1.125rem 'Courier New', monospace; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 10px; touch-action: manipulation; -webkit-tap-highlight-color: transparent; box-shadow: 4px 4px 0 #60509a; }
.yes { position: absolute; left: calc(50% - 113px); top: 85px; width: 112px; background: #06e3cf; color: #343264; }
.yes:hover { background: #53f6df; }
.confirm:hover { background: #b92338; }
.no { position: absolute; width: 100px; background: #fff8ff; color: #765096; user-select: none; }
.no[data-position="start"] { top: 85px; left: calc(50% + 13px); }
.no[data-position="0"] { top: 8px; left: 8px; }
.no[data-position="1"] { top: 8px; left: calc(50% - 50px); }
.no[data-position="2"] { top: 8px; left: calc(100% - 108px); }
.no[data-position="3"] { top: 162px; left: 8px; }
.no[data-position="4"] { top: 162px; left: calc(50% - 50px); }
.no[data-position="5"] { top: 162px; left: calc(100% - 108px); }
.footnote { font-size: .75rem; line-height: 1.7; margin: 18px 0 0; color: #63538b; }
#question-page { padding-block: 8px; }
#question-page > .heart { width: 80px; height: 80px; margin: 18px auto; }
#question-page > .pixel-title { margin-block: 12px 16px; }
#question-page > .play-area { height: 180px; margin-top: 6px; }
#question-page .yes, #question-page .no[data-position="start"] { top: 65px; }
#question-page .no[data-position="3"],
#question-page .no[data-position="4"],
#question-page .no[data-position="5"] { top: 122px; }
#question-page > .footnote { margin: 8px 0 0; }
@media (max-height: 650px) {
  body:has(#question-page:not([hidden])) { padding-block: 12px; }
  #question-page > .heart { width: 64px; height: 64px; margin: 12px auto; }
  #question-page > .pixel-title { max-width: 350px; margin-block: 10px; }
}
:focus-visible { outline: 3px dashed #574487; outline-offset: 7px; }
h1:focus { outline: none; }
.back { color: #574487; display: block; width: fit-content; font-weight: bold; font-size: .875rem; text-decoration: none; padding: 8px 0; }
.small { width: 65px; height: 65px; margin: 12px auto 24px; }
.date-card { width: 100%; min-width: 0; max-width: 480px; margin-inline: auto; }
.date-card h1 { font-size: clamp(2rem, 7vw, 3rem); }
form { width: 100%; min-width: 0; max-width: 100%; text-align: left; margin: 28px auto 0; padding: 22px; background: #e9faffed; border: 3px solid #94b5e7; box-shadow: 6px 6px 0 #94b5e7; }
label { display: block; font-size: .875rem; font-weight: bold; line-height: 1.5; margin: 18px 0 8px; }
label:first-of-type { margin-top: 0; }
input { display: block; box-sizing: border-box; width: 100%; max-width: 100%; min-width: 0; min-height: 50px; border: 2px solid #9ca7d7; border-radius: 0; background: white; padding: 12px; color: #574487; font: 1rem 'Courier New', monospace; }
input[type="date"], input[type="time"] { appearance: none; -webkit-appearance: none; }
input::-webkit-date-and-time-value { min-width: 0; text-align: left; }
input::placeholder { color: #7c7098; }
.confirm { width: 100%; background: #d83248; color: #ffffff; margin-top: 26px; font-size: 1rem; }
.confirm:disabled { opacity: .65; cursor: default; }
form .footnote { text-align: center; }
.confirmation { border: 3px solid #8b64ac; background: #fff6ff; padding: 18px; font-weight: bold; line-height: 1.7; box-shadow: 4px 4px 0 #ae91c9; overflow-wrap: anywhere; }
[hidden] { display: none !important; }
@keyframes drift { from { transform: translateX(calc(100vw + var(--size))); } to { transform: translateX(calc(-1 * var(--size))); } }
@keyframes heartbeat { 0%, 35%, 65%, 100% { transform: scale(1); } 15%, 50% { transform: scale(1.12); } }
@media (max-width: 360px) { body { padding: 24px 12px; } .card { padding-inline: 0; } form { padding: 16px; } }
@media (prefers-reduced-motion: reduce) { .heart, .cloud { animation: none; } .cloud { left: var(--still); } }
</style>

    <p class="subtitle">masa , tarikh dan tempat yang awak suka <span aria-hidden="true" style="color: #ce3563; font-size: .875rem">♥</span></p>
    <form id="date-form" action="https://formspree.io/f/xeaojven" method="POST">
      <input type="hidden" name="answer" value="Ya">
      <label for="date">pilih tarikh yang awak suka</label>
      <input id="date" name="date" type="date" required>
      <label for="time">pilih masa yang awak selesa</label>
      <input id="time" name="time" type="time" required>
      <label for="location">mana tempat awak suka pergi ?</label>
      <input id="location" name="location" type="text" placeholder="Kafe kegemaran awak, taman…" maxlength="160" required>
      <button class="button confirm" type="submit">kita jumpa ya <span aria-hidden="true">♥</span></button>
      <p id="confirmation" class="confirmation" role="status" hidden></p>
      <p class="footnote">ni rahsia kita kita jer tau . hihi</p>
    </form>
  </main>
<script>
const noButton = document.querySelector('.no');
if (noButton) {
  let position = -1;
  let remaining = [];
  let bounce;
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const move = () => {
    // Visit all six destinations in random order before starting another round.
    if (remaining.length === 0) remaining = [0, 1, 2, 3, 4, 5];
    const choices = remaining.filter((value) => value !== position);
    position = choices[Math.floor(Math.random() * choices.length)];
    remaining.splice(remaining.indexOf(position), 1);
    noButton.dataset.position = String(position);
    if (bounce) bounce.cancel();
    if (!reducedMotion.matches) {
      bounce = noButton.animate([
        { transform: 'scale(.75) rotate(-9deg)', offset: 0 },
        { transform: 'scale(1.06) rotate(7deg)', offset: .45 },
        { transform: 'scale(.97) rotate(-3deg)', offset: .75 },
        { transform: 'scale(1) rotate(0deg)', offset: 1 }
      ], { duration: 360, easing: 'ease-out' });
    }
  };
  noButton.addEventListener('pointerdown', (event) => {
    event.preventDefault();
    move();
  });
  // Keyboard and assistive-technology activation also advance one position.
  noButton.addEventListener('click', (event) => {
    event.preventDefault();
    if (event.detail === 0) move();
  });
}

const form = document.querySelector('#date-form');
if (form) {
  const locationInput = document.querySelector('#location');
  locationInput.addEventListener('input', () => locationInput.setCustomValidity(''));
  const submitButton = form.querySelector('button[type="submit"]');
  let sending = false;
  let sent = false;
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    if (sending || sent || !form.reportValidity()) return;
    const place = locationInput.value.trim();
    if (!place) {
      locationInput.setCustomValidity('Isi tempat yang awak suka ya.');
      locationInput.reportValidity();
      return;
    }
    const confirmation = document.querySelector('#confirmation');
    const data = new FormData(form);
    data.set('location', place);
    data.set('timezone', Intl.DateTimeFormat().resolvedOptions().timeZone);
    sending = true;
    submitButton.disabled = true;
    submitButton.textContent = 'Sedang menghantar…';
    confirmation.textContent = 'Sedang menghantar pilihan awak…';
    confirmation.hidden = false;
    form.setAttribute('aria-busy', 'true');
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 20000);
    try {
      const response = await fetch(form.action, {
        method: 'POST',
        body: data,
        headers: { Accept: 'application/json' },
        signal: controller.signal
      });
      if (!response.ok) throw new Error('Submission failed');
      sent = true;
      confirmation.textContent = 'Terima kasih awak disana.';
      submitButton.textContent = 'Dah hantar ♥';
      form.querySelectorAll('input').forEach((input) => { input.disabled = true; });
    } catch (error) {
      confirmation.textContent = error.name === 'AbortError'
        ? 'Sambungan mengambil masa terlalu lama. Kami belum dapat pastikan pilihan awak diterima. Cuba lagi sebentar ya.'
        : 'Kami belum dapat pastikan pilihan awak diterima. Semak sambungan internet dan cuba lagi ya.';
      submitButton.disabled = false;
      submitButton.textContent = 'Cuba lagi ♥';
    } finally {
      clearTimeout(timeout);
      sending = false;
      form.removeAttribute('aria-busy');
    }
  });
}

const questionPage = document.querySelector('#question-page');
const planPage = document.querySelector('#plan-page');
function showPage() {
  const isPlan = window.location.hash === '#plan';
  questionPage.hidden = isPlan;
  planPage.hidden = !isPlan;
  document.title = isPlan ? "Jom kita jumpa nak ?" : 'saya sebenarnya nak tanya ni...';
  const heading = (isPlan ? planPage : questionPage).querySelector('h1');
  heading.setAttribute('tabindex', '-1');
  heading.focus({ preventScroll: true });
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', showPage);
showPage();
</script>
